
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIPPY - Official Website</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:#08071a;color:#fff;overflow-x:hidden;min-height:100vh}.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(130% 100% at 15% 15%, #7c3aed 0%, #4f46e5 28%, #1e1b4b 55%, #020617 90%)}.container{max-width:780px;margin:0 auto;padding:20px 18px 130px;position:relative;z-index:2}.bubble{background:linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.06));backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.16);border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-height:0;opacity:0;overflow:hidden;transform:translateY(-8px);transition:all .5s}.pr-grid.open{max-height:1200px;opacity:1;transform:translateY(0);margin-top:14px}.pr-card{padding:18px;border-radius:22px;color:#fff;display:block;text-decoration:none}.c1{background:linear-gradient(135deg, rgba(168,85,247,.28), rgba(255,255,255,.06));border:1px solid rgba(168,85,247,.35)}.c2{background:linear-gradient(135deg, rgba(59,130,246,.26), rgba(255,255,255,.06));border:1px solid rgba(59,130,246,.32)}.c3{background:linear-gradient(135deg, rgba(236,72,153,.26), rgba(255,255,255,.06));border:1px solid rgba(236,72,153,.32)}.c4{background:linear-gradient(135deg, rgba(34,197,94,.22), rgba(255,255,255,.06));border:1px solid rgba(34,197,94,.28)}.c5{background:linear-gradient(135deg, rgba(250,204,21,.26), rgba(255,255,255,.08));border:1px solid rgba(250,204,21,.4);grid-column:1/-1}.btn{width:100%;display:inline-flex;justify-content:center;align-items:center;gap:8px;background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;font-weight:700;padding:13px 22px;border-radius:100px;text-decoration:none;margin-top:14px;border:none;cursor:pointer}.benefit{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:12px 14px;border-radius:16px;margin-bottom:10px}.ticket-card{background:linear-gradient(135deg, #1e1b4b 0%, #2e1065 50%, #1e1b4b 100%);border:1px dashed rgba(167,139,250,.4);border-radius:24px;padding:22px}.badge{background:#a78bfa;color:#1e1b4b;font-weight:800;font-size:11px;padding:5px 10px;border-radius:100px}.ticket-title{font-size:26px;font-weight:800;margin-top:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-box{background:linear-gradient(180deg, #1a1740, #0f0d2a);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:22px;width:100%;max-width:500px;max-height:90vh;overflow:auto}.input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;color:#fff;margin-top:8px}.label{font-size:12px;color:#a5b4fc;margin-top:14px;display:block;font-weight:600;text-transform:uppercase}.pr-select{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pr-opt{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer;text-align:center;font-weight:600;font-size:13px}.pr-opt.active{background:linear-gradient(135deg,#7c3aed,#3b82f6);border-color:#a78bfa}#loader{position:fixed;inset:0;z-index:9999;background:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}#loader.hidden{opacity:0;pointer-events:none}.loader-logo{width:220px;height:220px;border-radius:50%;overflow:hidden;box-shadow:0 0 60px rgba(124,58,237,.6);animation:pulse 1s infinite alternate}.loader-logo img{width:100%;height:100%;object-fit:cover}.drippy-text{font-size:52px;font-weight:900;letter-spacing:2px;margin-top:22px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:dripAnim 1s infinite}@keyframes dripAnim{0%{transform:translateY(0) scaleY(1)}30%{transform:translateY(8px) scaleY(1.15)}60%{transform:translateY(-2px) scaleY(0.95)}100%{transform:translateY(0) scaleY(1)}}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}.loader-bar{width:240px;height:8px;background:rgba(255,255,255,.1);border-radius:100px;margin-top:28px;overflow:hidden}.loader-fill{height:100%;width:0%;background:linear-gradient(90deg,#7c3aed,#3b82f6,#ec4899);border-radius:100px;transition:width .1s linear}.loader-percent{margin-top:12px;font-size:14px;color:#a5b4fc;font-weight:700}.price-box{background:linear-gradient(135deg, rgba(124,58,237,.25), rgba(59,130,246,.15));border:1px solid rgba(124,58,237,.3);padding:16px;border-radius:18px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
